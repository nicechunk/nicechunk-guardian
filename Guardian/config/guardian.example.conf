guardian_id = "guardian-001"

listen_host = "0.0.0.0"
listen_port = 8080
public_port = 8080
public_url = "ws://127.0.0.1:8080/ws"
path = "/ws"

tls = false
cert_file = ""
key_file = ""

guardian_center_chunk_x = 0
guardian_center_chunk_z = 0
service_radius_chunks = 100

player_aoi_chunks = 15
player_aoi_radius_chunks = 7

chunk_size_blocks = 16
position_precision = 64

max_connections = 50000
max_players = 60000
max_players_per_chunk = 1024

movement_broadcast_hz = 20
client_move_rate_limit_per_sec = 30
client_dig_rate_limit_per_sec = 10
client_equipment_rate_limit_per_sec = 10
client_building_announce_rate_limit_per_sec = 4

max_building_records = 16384
building_manifest_file = "guardian-buildings.bin"

max_payload_length = 4096
max_backpressure = 262144
close_on_backpressure_limit = false
echo_self = true

enable_text_frame = false
enable_ws_compression = false
enable_tui = true
tui_refresh_hz = 2
tui_log_capacity = 200
idle_timeout_sec = 15
heartbeat_interval_sec = 5
hello_timeout_sec = 5
stats_interval_sec = 10

log_level = "info"
