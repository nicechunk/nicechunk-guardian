<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Guardian binary protocol frame</title>
  <desc id="desc">A diagram showing fixed-size Guardian WebSocket message families and why they are easy to rate-limit, batch, and test.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d14"/><stop offset="1" stop-color="#15110c"/></linearGradient>
    <style>.label{font:800 12px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;fill:#90ff1a}.title{font:850 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f8ff}.copy{font:500 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c7d4}.card{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);stroke-width:1.2;rx:16}.head{font:800 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f8ff}.small{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#bdd0df}.mono{font:750 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f7d98f}.slot{stroke:rgba(255,255,255,.22);stroke-width:1;rx:8}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1040" cy="130" r="260" fill="#83ff00" opacity=".08"/>
  <text x="70" y="78" class="label">GUARDIAN BINARY PROTOCOL</text>
  <text x="70" y="132" class="title">Fixed frames keep realtime traffic predictable.</text>
  <text x="70" y="168" class="copy">Most gameplay messages are fixed-size binary frames; chat is the only bounded variable payload.</text>
  <rect class="card" x="76" y="238" width="1128" height="132"/><text x="106" y="282" class="head">Frame family</text>
  <rect class="slot" x="106" y="306" width="110" height="38" fill="#14251b"/><text x="128" y="331" class="mono">type</text>
  <rect class="slot" x="232" y="306" width="210" height="38" fill="#102236"/><text x="254" y="331" class="mono">fixed payload</text>
  <rect class="slot" x="458" y="306" width="250" height="38" fill="#151c2d"/><text x="480" y="331" class="mono">server tick / seq</text>
  <rect class="slot" x="724" y="306" width="216" height="38" fill="#2a1f0f"/><text x="746" y="331" class="mono">rate-limitable</text>
  <rect class="slot" x="956" y="306" width="188" height="38" fill="#18251f"/><text x="978" y="331" class="mono">testable</text>
  <g transform="translate(94 434)"><rect class="card" width="244" height="126"/><text x="24" y="42" class="head">Handshake</text><text x="24" y="76" class="mono">HELLO 52 bytes</text><text x="24" y="102" class="mono">ACK 20 bytes</text></g>
  <g transform="translate(374 434)"><rect class="card" width="244" height="126"/><text x="24" y="42" class="head">Movement</text><text x="24" y="76" class="mono">MOVE 13 bytes</text><text x="24" y="102" class="mono">ITEM 12 bytes</text></g>
  <g transform="translate(654 434)"><rect class="card" width="244" height="126"/><text x="24" y="42" class="head">World action</text><text x="24" y="76" class="mono">DIG 11 bytes</text><text x="24" y="102" class="mono">EVENT 14 bytes</text></g>
  <g transform="translate(934 434)"><rect class="card" width="244" height="126"/><text x="24" y="42" class="head">Chat</text><text x="24" y="76" class="mono">header + 120 max</text><text x="24" y="102" class="small">explicit UTF-8 bound</text></g>
  <text x="276" y="636" class="copy">A compact protocol is easier to fuzz, benchmark, and keep compatible with the browser client.</text>
</svg>
