<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Session Ownership Flow</title>
  <desc id="desc">Guardian session ownership flow for nicechunk-guardian.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#14170d"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#8fdcff"/></marker>
    <style>.label{font:800 12px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;fill:#90ff1a}.title{font:850 38px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f8ff}.copy{font:500 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c7d4}.card{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);stroke-width:1.2;rx:18}.head{font:800 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f8ff}.small{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#bdd0df}.mono{font:750 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f7d98f}.line{stroke:#8fdcff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#83ff00" opacity=".075"/><circle cx="210" cy="610" r="280" fill="#00c2ff" opacity=".075"/>
  <text x="70" y="78" class="label">GUARDIAN SESSION MODEL</text>
  <text x="70" y="132" class="title">Realtime identity stays lightweight but explicit.</text>
  <text x="70" y="168" class="copy">Guardian tracks wallet hints, hashes, fingerprints, room membership, and protocol frames without becoming custody logic.</text>
  <g transform="translate(70 250)"><rect class="card" width="222" height="236"/><text x="24" y="42" class="head">Hello frame</text><text x="24" y="80" class="small">wallet bytes</text><text x="24" y="110" class="small">chunk coordinate</text><text x="24" y="140" class="small">nonce</text><text x="24" y="170" class="small">protocol version</text><text x="24" y="204" class="mono">MSG_HELLO</text></g>
  <g transform="translate(374 250)"><rect class="card" width="222" height="236"/><text x="24" y="42" class="head">Owner index</text><text x="24" y="80" class="small">hash wallet</text><text x="24" y="110" class="small">fingerprint</text><text x="24" y="140" class="small">duplicate handling</text><text x="24" y="170" class="small">retire old peers</text><text x="24" y="204" class="mono">GuardianState</text></g>
  <g transform="translate(678 250)"><rect class="card" width="222" height="236"/><text x="24" y="42" class="head">Room state</text><text x="24" y="80" class="small">movement</text><text x="24" y="110" class="small">dig sequence</text><text x="24" y="140" class="small">chat cap</text><text x="24" y="170" class="small">join and leave</text><text x="24" y="204" class="mono">chunk room</text></g>
  <g transform="translate(982 250)"><rect class="card" width="226" height="236"/><text x="24" y="42" class="head">Boundary</text><text x="24" y="80" class="small">no custody</text><text x="24" y="110" class="small">no settlement</text><text x="24" y="140" class="small">no account authority</text><text x="24" y="170" class="small">chain stays external</text><text x="24" y="204" class="mono">realtime only</text></g>
  <path class="line" d="M292 368 H354"/><path class="line" d="M596 368 H658"/><path class="line" d="M900 368 H962"/>
  <text x="140" y="626" class="copy">The server should make live coordination fast while leaving ownership, staking, and settlement to Solana programs.</text>
</svg>
